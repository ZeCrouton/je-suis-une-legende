<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Je suis une légende — Hors ligne</title>
  <style>
    :root { --bg:#f6f3ec; --fg:#1d2233; --muted:#5b6275; --accent:#8a6a2f; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg:#10182d; --fg:#f2eee4; --muted:#aab1c4; --accent:#c9a96e; }
    }
    :root[data-theme="dark"] { --bg:#10182d; --fg:#f2eee4; --muted:#aab1c4; --accent:#c9a96e; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); }
    body { font-family: Georgia, "Times New Roman", serif; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:0 16px; box-sizing:border-box; }
    main { max-width:520px; text-align:center; }
    .mark { font-size:2rem; color:var(--accent); }
    h1 { font-weight:normal; font-size:1.9rem; margin:.4em 0 .6em; }
    p { color:var(--muted); line-height:1.6; font-size:1.05rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark">✦</div>
    <h1>Je suis une légende</h1>
    <p>Le site est temporairement hors ligne pour une mise au point.</p>
    <p>Merci de revenir un peu plus tard.</p>
  </main>
</body>
</html>
